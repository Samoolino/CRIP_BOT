name: Real V2 Fork Gate

on:
  workflow_dispatch:

jobs:
  real-v2-fork:
    runs-on: ubuntu-latest
    env:
      RPC_URL: ${{ secrets.CRIP_RPC_URL }}
      V2_FACTORY: ${{ secrets.CRIP_V2_FACTORY }}
      V2_ROUTER: ${{ secrets.CRIP_V2_ROUTER }}
      V2_PAIR: ${{ secrets.CRIP_V2_PAIR }}
      BORROW_TOKEN: ${{ secrets.CRIP_BORROW_TOKEN }}
      REPAYMENT_TOKEN: ${{ secrets.CRIP_REPAYMENT_TOKEN }}
      INTERMEDIATE_TOKEN: ${{ secrets.CRIP_INTERMEDIATE_TOKEN }}
      BORROW_AMOUNT_WEI: ${{ secrets.CRIP_BORROW_AMOUNT_WEI }}
      MIN_PROFIT_WEI: ${{ secrets.CRIP_MIN_PROFIT_WEI }}
      SLIPPAGE_BPS: ${{ secrets.CRIP_SLIPPAGE_BPS }}
      DEADLINE_SECONDS: ${{ secrets.CRIP_DEADLINE_SECONDS }}
      EXECUTE_FORK: ${{ secrets.CRIP_EXECUTE_FORK }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Validate fork configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RPC_URL" || { echo 'Missing CRIP_RPC_URL'; exit 1; }
          test -n "$V2_FACTORY" || { echo 'Missing CRIP_V2_FACTORY'; exit 1; }
          test -n "$V2_ROUTER" || { echo 'Missing CRIP_V2_ROUTER'; exit 1; }
          test -n "$BORROW_TOKEN" || { echo 'Missing CRIP_BORROW_TOKEN'; exit 1; }
          test -n "$REPAYMENT_TOKEN" || { echo 'Missing CRIP_REPAYMENT_TOKEN'; exit 1; }
          test "$BORROW_TOKEN" != "$REPAYMENT_TOKEN" || { echo 'Borrow and repayment tokens must differ'; exit 1; }

      - name: Install Foundry standard library
        run: forge install foundry-rs/forge-std

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Discover source pair when not supplied
        if: ${{ env.V2_PAIR == '' }}
        shell: bash
        run: |
          set -euo pipefail
          pair=$(cast call "$V2_FACTORY" "getPair(address,address)(address)" "$BORROW_TOKEN" "$REPAYMENT_TOKEN" --rpc-url "$RPC_URL")
          pair=$(echo "$pair" | tr -d '[:space:]')
          test -n "$pair" || { echo 'Factory returned empty pair'; exit 1; }
          test "$pair" != "0x0000000000000000000000000000000000000000" || { echo 'Factory pair does not exist'; exit 1; }
          echo "V2_PAIR=$pair" >> "$GITHUB_ENV"
          echo "Discovered V2 pair: $pair"

      - name: Run real deployment inspection
        run: forge test --match-path test/FlashSwapExecutor.fork.t.sol -vvv

      - name: Run optional real-router quote
        if: ${{ env.BORROW_AMOUNT_WEI != '' && env.INTERMEDIATE_TOKEN != '' }}
        run: forge test --match-path test/RouterQuote.fork.t.sol -vvv

      - name: Run opt-in atomic execution on fork
        if: ${{ env.EXECUTE_FORK == 'true' }}
        run: |
          test -n "$INTERMEDIATE_TOKEN" || { echo 'Missing CRIP_INTERMEDIATE_TOKEN'; exit 1; }
          test -n "$BORROW_AMOUNT_WEI" || { echo 'Missing CRIP_BORROW_AMOUNT_WEI'; exit 1; }
          test -n "$MIN_PROFIT_WEI" || { echo 'Missing CRIP_MIN_PROFIT_WEI'; exit 1; }
          test -n "$SLIPPAGE_BPS" || { echo 'Missing CRIP_SLIPPAGE_BPS'; exit 1; }
          forge test --match-path test/FlashSwapExecutor.execution.fork.t.sol -vvv
